version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: gh-orbit
    binary: gh-orbit
    main: ./cmd/orbit
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - "-s -w -X main.version={{.Version}}"

archives:
  - id: gh-orbit
    formats: [binary]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}-{{ .Arch }}{{- if eq .Os "windows" }}.exe{{ end }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git

release:
  draft: false
  prerelease: false
